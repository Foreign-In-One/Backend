server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/paycheck_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

paycycle:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  ocr:
    documentai:
      project-id: ${DOCUMENTAI_PROJECT_ID:}
      location: ${DOCUMENTAI_LOCATION:us}
      processor-id: ${DOCUMENTAI_PROCESSOR_ID:}
      credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  batch:
    cron: ${SALARY_MONITORING_CRON:0 0 9 * * *}