server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

paycycle:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
  ocr:
    documentai:
      project-id: ${DOCUMENTAI_PROJECT_ID:}
      location: ${DOCUMENTAI_LOCATION:us}
      processor-id: ${DOCUMENTAI_PROCESSOR_ID:}
      credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  batch:
    cron: ${SALARY_MONITORING_CRON:0 0 9 * * *}
